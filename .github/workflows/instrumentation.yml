# Device tests on a disposable Android TV emulator: manual and nightly (plan/06 §5). They do not
# gate pull requests; emulator runs are slow and flakier.
name: Instrumentation

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

concurrency:
  group: instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected:
    name: Android TV emulator (API 30)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          # The build refuses device tasks without an emulator serial (a real TV may be attached).
          ANDROID_SERIAL: emulator-5554
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-metrics -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon :core:data:connectedDebugAndroidTest :app:connectedDebugAndroidTest
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: instrumentation-reports
          retention-days: 14
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
