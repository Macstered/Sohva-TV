name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Unit tests, lint, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Action versions, checked 8 September 2026: the runner deprecated Node.js 20
    # and named checkout@v4, setup-java@v4, upload-artifact@v4 and
    # setup-gradle@v4. checkout@v5, setup-java@v5 and upload-artifact@v6 are the
    # Node 24 releases with no other change of behaviour. setup-gradle stays at
    # v5 on purpose: v6 moves its caching into a component under separate
    # licence terms, which is a decision for the owner, not for a version bump.
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # The release signing identity lives in .local/streammate-signing/, which is
      # deliberately not in the repository. app/build.gradle.kts tolerates its
      # absence, so the release build here produces an unsigned APK. That is
      # enough to catch R8/resource/manifest breakage; it is not a shippable
      # artifact and is not uploaded.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Phone setup page tests (Node built-ins only)
        run: node --test scripts/tests/addon-phone-page.test.cjs

      - name: Lint
        run: ./gradlew lintDebug

      - name: Compile instrumentation tests
        run: ./gradlew assembleDebugAndroidTest

      - name: Assemble release
        run: ./gradlew assembleRelease

      # Discover lives in main and is covered by the ordinary tests/lint above.
      # Keep the isolated release-like Lab package and its test entry points buildable.
      - name: Compile and lint isolated addon Lab
        run: ./gradlew -PsohvaTestBuildType=lab :app:assembleLab :app:lintLab :app:assembleLabAndroidTest

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
